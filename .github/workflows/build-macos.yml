name: Build macOS installers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dmg:
    name: macOS ${{ matrix.arch }} DMG
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          check-latest: true
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build macOS disk image
        run: npm run tauri build -- --bundles dmg

      - name: Upload macOS disk image
        uses: actions/upload-artifact@v7
        with:
          name: Sound-Monitor-macOS-${{ matrix.arch }}-DMG
          path: target/release/bundle/dmg/*.dmg
          if-no-files-found: error
