; Sound Monitor settings
; Times use local 24-hour HH:MM format.

[general]
; Supported values: da, en
language = da

[service]
soundcheck_start_time = 09:30
start_time = 10:30
auto_start_enabled = true
auto_split_enabled = true

[classifications.da]
service = Gudstjeneste
worship-night = Lovsangsaften
concert = Koncert
conference = Konference
rehearsal = Prøve
soundcheck = Lydprøve
special = Særligt event

[classifications.en]
service = Service
worship-night = Worship night
concert = Concert
conference = Conference
rehearsal = Rehearsal
soundcheck = Soundcheck
special = Special event

; Nextcloud preparation only: local storage remains active.
; Never put passwords or tokens here. Uncomment fields when needed.
[nextcloud]
; base_url = https://cloud.example.org/remote.php/dav/files/user
; remote_path = SoundMonitor
; username = user
; credential_reference = sound-monitor/nextcloud
